<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Catalão - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- LOGIN -->
    <div id="loginArea" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
            <h1 class="text-3xl font-bold text-blue-900 mb-6">Sistema Catalão</h1>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" placeholder="Seu E-mail" required class="w-full px-4 py-2 border rounded-lg">
                <input type="password" id="senha" placeholder="Sua Senha" required class="w-full px-4 py-2 border rounded-lg">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Entrar</button>
            </form>
            <div id="mensagem" class="mt-4 text-sm font-semibold hidden"></div>
        </div>
    </div>

    <!-- SISTEMA LOGADO -->
    <div id="sistemaArea" class="hidden flex flex-col h-screen">
        <!-- Navegação Topo -->
        <div class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center flex-wrap gap-2">
            <h1 class="text-xl font-bold">Catalão CRM</h1>
            <div class="space-x-2">
                <button onclick="mostrarAba('captacao')" class="bg-blue-700 px-3 py-1 rounded hover:bg-blue-600 text-sm">Nova Captação</button>
                <button onclick="mostrarAba('funil'); carregarFunil();" class="bg-blue-700 px-3 py-1 rounded hover:bg-blue-600 text-sm">Funil Kanban</button>
            </div>
        </div>

        <!-- ABA 1: NOVA CAPTAÇÃO -->
        <div id="abaCaptacao" class="p-4 flex-1 overflow-y-auto flex justify-center">
            <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg h-fit">
                <h2 class="text-xl font-bold mb-4">Nova Captação</h2>
                <form id="captacaoForm" class="space-y-3">
                    <div class="flex space-x-2">
                        <input type="text" id="rua" placeholder="Rua" required class="w-2/3 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                        <input type="text" id="numero" placeholder="Nº" required class="w-1/3 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <input type="text" id="bairro" placeholder="Bairro" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    
                    <div class="flex space-x-2">
                        <select id="tipo_imovel" class="w-1/2 px-3 py-2 border rounded-lg bg-white">
                            <option value="placa">Placa</option>
                            <option value="prédio">Prédio</option>
                            <option value="construtora">Construtora</option>
                        </select>
                        <select id="categoria" class="w-1/2 px-3 py-2 border rounded-lg bg-white">
                            <option value="Proprietário">Proprietário</option>
                            <option value="Obra/Construtora">Construtora</option>
                        </select>
                    </div>

                    <div class="flex space-x-2">
                        <select id="origem" class="w-1/3 px-3 py-2 border rounded-lg bg-white text-sm">
                            <option value="campo">Campo</option>
                            <option value="olx">OLX</option>
                            <option value="indicacao">Indicação</option>
                            <option value="outro">Outro</option>
                        </select>
                        <input type="text" id="nome" placeholder="Nome do Dono/Empresa" required class="w-2/3 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>

                    <input type="text" id="telefone" placeholder="Telefone (Corretor não vê)" class="w-full px-3 py-2 border rounded-lg bg-blue-50">
                    
                    <textarea id="observacoes" placeholder="Observações (ex: Falar com porteiro João)" class="w-full px-3 py-2 border rounded-lg text-sm" rows="2"></textarea>
                    
                    <div class="pt-2">
                        <label class="block text-sm font-medium mb-1">Fotos (Opcional por enquanto)</label>
                        <input type="file" id="fotos" accept="image/*" multiple capture="environment" class="w-full border p-2 rounded-lg bg-gray-50 text-sm">
                    </div>

                    <div class="flex items-center mt-2 mb-2">
                        <input type="checkbox" id="manter_endereco" class="mr-2 h-4 w-4 text-blue-600">
                        <label for="manter_endereco" class="text-sm text-gray-700">Continuar na mesma rua/bairro após salvar</label>
                    </div>

                    <button type="submit" id="btnSalvar" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition">Salvar Captação</button>
                </form>
                <div id="msgCaptacao" class="mt-4 text-sm font-semibold hidden text-center"></div>
            </div>
        </div>

        <!-- ABA 2: FUNIL KANBAN -->
        <div id="abaFunil" class="hidden p-4 flex-1 flex flex-col bg-gray-200 overflow-hidden">
            
            <!-- Barra de Busca e Exportação -->
            <div class="mb-4 flex gap-2 w-full overflow-x-auto pb-2">
                <input type="text" id="buscaKanban" oninput="carregarFunil()" placeholder="Buscar rua, nome ou obs..." class="flex-1 min-w-[200px] px-4 py-2 border rounded-lg shadow-sm">
                <button onclick="exportarExcel()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded-lg shadow flex-shrink-0">
                    📥 Exportar CSV
                </button>
            </div>

            <!-- Quadro Kanban -->
            <div id="kanbanBoard" class="flex space-x-4 flex-1 overflow-x-auto overflow-y-hidden pb-4" style="min-width: max-content;">
                <!-- Colunas carregam aqui -->
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ravfieobwgtlbryjrrny.supabase.co';
        const supabaseKey = 'sb_publishable_6Yh1LhK4Zi7v9wqQM1a8cA_UhH-CCQW';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        let usuarioId = null;
        let captacoesGlobais = []; // Guarda os dados para busca e excel

        const statusLista = ['não contatado', 'contatado', 'respondeu', 'qualificado', 'visita agendada', 'autorização assinada', 'cadastrado'];

        function mostrarAba(aba) {
            document.getElementById('abaCaptacao').classList.add('hidden');
            document.getElementById('abaFunil').classList.add('hidden');
            if(aba === 'captacao') document.getElementById('abaCaptacao').classList.remove('hidden');
            if(aba === 'funil') document.getElementById('abaFunil').classList.remove('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('mensagem').classList.remove('hidden');
            document.getElementById('mensagem').textContent = 'Conectando...';
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('senha').value,
            });

            if (!error) {
                usuarioId = data.user.id;
                document.getElementById('loginArea').classList.add('hidden');
                document.getElementById('sistemaArea').classList.remove('hidden');
                mostrarAba('captacao');
            } else {
                document.getElementById('mensagem').textContent = 'Erro no login.';
            }
        });

        // SALVAR CAPTAÇÃO
        document.getElementById('captacaoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSalvar');
            btn.textContent = 'Salvando...'; btn.disabled = true;

            try {
                const arquivos = document.getElementById('fotos').files;
                let linksFotos = [];
                for(let arquivo of arquivos) {
                    const nome = `${usuarioId}/${Date.now()}-${arquivo.name}`;
                    const { data } = await supabaseClient.storage.from('fotos_captacao').upload(nome, arquivo);
                    if(data) linksFotos.push(supabaseClient.storage.from('fotos_captacao').getPublicUrl(nome).data.publicUrl);
                }

                await supabaseClient.from('captacoes').insert([{
                    rua: document.getElementById('rua').value,
                    numero: document.getElementById('numero').value,
                    bairro: document.getElementById('bairro').value,
                    tipo_imovel: document.getElementById('tipo_imovel').value,
                    categoria: document.getElementById('categoria').value,
                    nome: document.getElementById('nome').value,
                    telefones: [document.getElementById('telefone').value],
                    origem: document.getElementById('origem').value,
                    observacoes: document.getElementById('observacoes').value,
                    fotos: linksFotos,
                    captador_id: usuarioId
                }]);

                document.getElementById('msgCaptacao').textContent = '✅ Salvo com sucesso!';
                document.getElementById('msgCaptacao').className = 'mt-4 text-green-600 block text-center';
                
                // Lógica de limpar ou manter endereço
                if(document.getElementById('manter_endereco').checked) {
                    const rua = document.getElementById('rua').value;
                    const bairro = document.getElementById('bairro').value;
                    document.getElementById('captacaoForm').reset();
                    document.getElementById('rua').value = rua;
                    document.getElementById('bairro').value = bairro;
                    document.getElementById('manter_endereco').checked = true;
                } else {
                    document.getElementById('captacaoForm').reset();
                }
                
                setTimeout(() => { document.getElementById('msgCaptacao').classList.add('hidden'); }, 3000);
            } catch(err) {
                alert("Erro ao salvar.");
            } finally {
                btn.textContent = 'Salvar Captação'; btn.disabled = false;
            }
        });

        // CARREGAR FUNIL COM BUSCA
        async function carregarFunil() {
            const board = document.getElementById('kanbanBoard');
            const termoBusca = document.getElementById('buscaKanban').value.toLowerCase();
            
            // Só busca no banco de novo se não tiver dados ou for a primeira vez
            if(captacoesGlobais.length === 0 || termoBusca === "") {
                const { data, error } = await supabaseClient.from('captacoes_vitrine').select('*').order('data_mapeamento', { ascending: false });
                if (error) return;
                captacoesGlobais = data;
            }

            // Aplica o filtro da busca
            const captacoesFiltradas = captacoesGlobais.filter(c => 
                (c.rua && c.rua.toLowerCase().includes(termoBusca)) || 
                (c.nome && c.nome.toLowerCase().includes(termoBusca)) ||
                (c.observacoes && c.observacoes.toLowerCase().includes(termoBusca))
            );

            board.innerHTML = '';
            
            statusLista.forEach(status => {
                const itens = captacoesFiltradas.filter(c => c.status_funil === status);
                
                let html = `
                    <div class="bg-gray-100 rounded-lg shadow w-72 flex-shrink-0 flex flex-col max-h-full">
                        <div class="p-3 border-b border-gray-200 bg-gray-50 rounded-t-lg font-bold text-gray-700 capitalize flex justify-between">
                            ${status} <span class="bg-gray-200 text-xs py-1 px-2 rounded-full">${itens.length}</span>
                        </div>
                        <div class="p-2 overflow-y-auto flex-1 space-y-3">
                `;

                itens.forEach(item => {
                    const fotoHtml = item.fotos && item.fotos.length > 0 ? `<img src="${item.fotos[0]}" class="w-full h-32 object-cover rounded mb-2">` : '';
                    const obsHtml = item.observacoes ? `<p class="text-xs text-gray-500 italic mt-1 bg-yellow-50 p-1 rounded">"${item.observacoes}"</p>` : '';
                    
                    html += `
                        <div class="bg-white p-3 rounded shadow-sm border border-gray-200 text-sm">
                            ${fotoHtml}
                            <p class="font-bold truncate">${item.rua}, ${item.numero}</p>
                            <p class="text-xs text-gray-500 mb-2">${item.bairro} - ${item.tipo_imovel}</p>
                            <p class="font-semibold text-blue-800">👤 ${item.nome}</p>
                            <p class="text-gray-600 mb-2">📞 ${item.telefones[0] || 'Sem telefone'}</p>
                            <div class="text-xs text-gray-400 mb-2">Origem: ${item.origem}</div>
                            ${obsHtml}
                            
                            <select onchange="mudarStatus('${item.id}', this.value)" class="w-full text-xs p-1 border rounded bg-gray-50 mt-2">
                                <option value="" disabled selected>Mover para...</option>
                                ${statusLista.map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>
                    `;
                });

                html += `</div></div>`;
                board.innerHTML += html;
            });
        }

        async function mudarStatus(id, novoStatus) {
            await supabaseClient.from('captacoes').update({ status_funil: novoStatus }).eq('id', id);
            // Zera a lista global pra forçar uma busca nova e atualizada no banco
            captacoesGlobais = [];
            carregarFunil(); 
        }

        // EXPORTAR EXCEL (CSV)
        function exportarExcel() {
            if(captacoesGlobais.length === 0) return alert("Nenhum dado para exportar.");
            
            let csv = 'Data,Origem,Rua,Numero,Bairro,Tipo,Nome,Telefone,Status,Observacoes\n';
            captacoesGlobais.forEach(c => {
                const dataFormatada = new Date(c.data_mapeamento).toLocaleDateString('pt-BR');
                const tels = c.telefones ? c.telefones.join(' / ') : '';
                // Limpa quebras de linha das observações pra não bugar o excel
                const obs = c.observacoes ? c.observacoes.replace(/(\r\n|\n|\r)/gm, " ") : ''; 
                
                csv += `"${dataFormatada}","${c.origem}","${c.rua}","${c.numero}","${c.bairro}","${c.tipo_imovel}","${c.nome}","${tels}","${c.status_funil}","${obs}"\n`;
            });
            
            const blob = new Blob(["\uFEFF"+csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'captacoes_catalao.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
