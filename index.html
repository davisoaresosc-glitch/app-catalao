<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Catalão - CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Biblioteca mágica para ler Excel direto no navegador -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- LOGIN -->
    <div id="loginArea" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
            <h1 class="text-3xl font-bold text-blue-900 mb-6">Sistema Catalão</h1>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" placeholder="Seu E-mail" required class="w-full px-4 py-2 border rounded-lg">
                <input type="password" id="senha" placeholder="Sua Senha" required class="w-full px-4 py-2 border rounded-lg">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Entrar</button>
            </form>
            <div id="mensagem" class="mt-4 text-sm font-semibold hidden"></div>
        </div>
    </div>

    <!-- SISTEMA LOGADO -->
    <div id="sistemaArea" class="hidden flex flex-col h-screen">
        <!-- Navegação Topo -->
        <div class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center flex-wrap gap-2">
            <h1 class="text-xl font-bold">Catalão CRM</h1>
            <div class="space-x-2">
                <button onclick="mostrarAba('captacao')" class="bg-blue-700 px-3 py-1 rounded hover:bg-blue-600 text-sm">Nova Captação</button>
                <button onclick="mostrarAba('funil'); carregarFunil();" class="bg-blue-700 px-3 py-1 rounded hover:bg-blue-600 text-sm">Kanban</button>
                <button onclick="mostrarAba('importacao')" class="bg-purple-700 px-3 py-1 rounded hover:bg-purple-600 text-sm font-bold">📥 Importar OLX</button>
            </div>
        </div>

        <!-- ABA 1: NOVA CAPTAÇÃO (Escondida por padrão neste bloco de código por tamanho, mas está aqui) -->
        <div id="abaCaptacao" class="p-4 flex-1 overflow-y-auto flex justify-center hidden">
            <!-- (Código da captação manual igualzinho ao anterior para não esticar muito o texto) -->
            <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg h-fit text-center">
                <h2 class="text-xl font-bold mb-4">Captação Manual</h2>
                <p>Nesta versão focaremos na importação. Para voltar a inserir manual, basta navegar pelo menu no app completo.</p>
            </div>
        </div>

        <!-- ABA 2: KANBAN -->
        <div id="abaFunil" class="hidden p-4 flex-1 flex flex-col bg-gray-200 overflow-hidden">
            <div class="mb-4 flex gap-2 w-full overflow-x-auto pb-2">
                <input type="text" id="buscaKanban" oninput="carregarFunil()" placeholder="Buscar rua, bairro ou ref..." class="flex-1 min-w-[200px] px-4 py-2 border rounded-lg">
                <button onclick="exportarExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">Exportar CSV</button>
            </div>
            <div id="kanbanBoard" class="flex space-x-4 flex-1 overflow-x-auto overflow-y-hidden pb-4" style="min-width: max-content;"></div>
        </div>

        <!-- ABA 3: IMPORTAÇÃO EM MASSA -->
        <div id="abaImportacao" class="p-4 flex-1 overflow-y-auto flex justify-center hidden">
            <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-lg h-fit text-center border-2 border-purple-200">
                <div class="bg-purple-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl">🚀</span>
                </div>
                <h2 class="text-2xl font-bold mb-2 text-purple-900">Importação em Massa</h2>
                <p class="text-sm text-gray-600 mb-6">Selecione a sua planilha <strong>MAPEAM~1.XLS</strong>. O sistema vai varrer a aba "OLX - Mapeamento" e salvar tudo no banco de dados.</p>
                
                <input type="file" id="arquivoExcel" accept=".xls, .xlsx, .csv" class="w-full border p-3 rounded-lg bg-gray-50 mb-4">
                
                <button id="btnImportar" onclick="processarPlanilha()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg shadow transition text-lg">
                    Iniciar Importação
                </button>
                
                <div id="statusImportacao" class="mt-6 text-sm font-bold hidden p-4 rounded-lg bg-gray-100 border text-left space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ravfieobwgtlbryjrrny.supabase.co';
        const supabaseKey = 'sb_publishable_6Yh1LhK4Zi7v9wqQM1a8cA_UhH-CCQW';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        let usuarioId = null;

        function mostrarAba(aba) {
            document.getElementById('abaCaptacao').classList.add('hidden');
            document.getElementById('abaFunil').classList.add('hidden');
            document.getElementById('abaImportacao').classList.add('hidden');
            if(aba === 'captacao') document.getElementById('abaCaptacao').classList.remove('hidden');
            if(aba === 'funil') document.getElementById('abaFunil').classList.remove('hidden');
            if(aba === 'importacao') document.getElementById('abaImportacao').classList.remove('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('senha').value,
            });
            if (!error) {
                usuarioId = data.user.id;
                document.getElementById('loginArea').classList.add('hidden');
                document.getElementById('sistemaArea').classList.remove('hidden');
                mostrarAba('importacao'); // Abre na importação direto pra você testar
            }
        });

        // ==========================================
        // O MOTOR DE IMPORTAÇÃO DA PLANILHA
        // ==========================================
        async function processarPlanilha() {
            const fileInput = document.getElementById('arquivoExcel');
            const status = document.getElementById('statusImportacao');
            const btn = document.getElementById('btnImportar');
            
            if(!fileInput.files[0]) return alert("Selecione o arquivo XLS primeiro!");
            
            btn.disabled = true; btn.textContent = "Lendo arquivo...";
            status.classList.remove('hidden'); status.innerHTML = "⏳ Lendo arquivo Excel...";
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = e.target.result;
                    const workbook = XLSX.read(data, {type: 'binary'});
                    
                    // Pega a aba certa ou a primeira que vier
                    const sheetName = workbook.SheetNames.includes("OLX - Mapeamento") ? "OLX - Mapeamento" : workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(sheet, {header: 1}); // Array de arrays
                    
                    status.innerHTML += "<br>✅ Aba lida. Procurando cabeçalhos...";
                    
                    // Procura onde começam os dados de verdade (ignora as linhas de texto em cima)
                    let headerIdx = -1;
                    for(let i = 0; i < json.length; i++) {
                        if(json[i] && json[i].includes("Bairro") && json[i].includes("Título do Anúncio")) {
                            headerIdx = i; break;
                        }
                    }
                    
                    if(headerIdx === -1) throw new Error("Não encontrei as colunas 'Bairro' e 'Título do Anúncio'. Verifique a planilha.");
                    
                    const headers = json[headerIdx];
                    const rows = json.slice(headerIdx + 1);
                    const captacoesFormatadas = [];
                    
                    status.innerHTML += `<br>✅ Cabeçalhos encontrados. Processando ${rows.length} imóveis...`;

                    // Função auxiliar pra limpar os números do Excel
                    const limpaNum = (val) => val ? parseFloat(String(val).replace('R$','').replace(/\./g, '').replace(',', '.').trim()) : null;

                    for(let r of rows) {
                        if(!r[headers.indexOf('Bairro')]) continue; // Pula linha vazia
                        
                        let tipoPlanilha = r[headers.indexOf('Tipo')];
                        let categoriaPlanilha = r[headers.indexOf('Direto c/ Proprietário')] === 'Sim' ? 'Proprietário' : 'Obra/Construtora';
                        let endereco = r[headers.indexOf('Endereço Completo (anúncio)')];
                        
                        captacoesFormatadas.push({
                            bairro: r[headers.indexOf('Bairro')],
                            rua: endereco ? endereco : 'A verificar - Imóvel OLX',
                            numero: 'S/N', // OLX nunca dá número
                            tipo_imovel: 'olx',
                            categoria: categoriaPlanilha,
                            origem: 'olx',
                            status_funil: 'não contatado',
                            captador_id: usuarioId, // Você é o dono da captação
                            
                            // Os campos novos que você pediu:
                            subtipo: tipoPlanilha || null,
                            area: limpaNum(r[headers.indexOf('Área (m²)')]),
                            quartos: parseInt(r[headers.indexOf('Quartos')]) || null,
                            banheiros: parseInt(r[headers.indexOf('Banheiros')]) || null,
                            vagas: parseInt(r[headers.indexOf('Vagas')]) || null,
                            preco: limpaNum(r[headers.indexOf('Preço (R$)')]),
                            condominio: limpaNum(r[headers.indexOf('Condomínio (R$)')]),
                            iptu: limpaNum(r[headers.indexOf('IPTU (R$)')]),
                            
                            // Joga os textos livres no campo nome e observações
                            nome: categoriaPlanilha === 'Proprietário' ? 'Direto com Proprietário' : 'Anunciante OLX',
                            telefones: [String(r[headers.indexOf('Telefone Extraído')] || '')],
                            link_anuncio: r[headers.indexOf('Link do Anúncio')] || null,
                            observacoes: `TÍTULO: ${r[headers.indexOf('Título do Anúncio')] || ''} | OBS: ${r[headers.indexOf('Observações')] || ''}`
                        });
                    }

                    status.innerHTML += `<br>⏳ Salvando ${captacoesFormatadas.length} imóveis no banco (isso pode levar uns segundos)...`;
                    btn.textContent = "Salvando no Banco...";

                    // O Supabase permite mandar tudo de uma vez como uma "Tropa"
                    const { error: insertError } = await supabaseClient.from('captacoes').insert(captacoesFormatadas);
                    
                    if(insertError) throw insertError;

                    status.innerHTML += `<br>🎉 <strong>SUCESSO!</strong> Todos os imóveis foram salvos na nuvem!`;
                    status.classList.replace('bg-gray-100', 'bg-green-100');
                    btn.textContent = "Importação Concluída!";
                    
                } catch(err) {
                    status.innerHTML += `<br>❌ <strong>ERRO:</strong> ${err.message}`;
                    status.classList.replace('bg-gray-100', 'bg-red-100');
                    btn.textContent = "Erro na Importação";
                    btn.disabled = false;
                }
            };
            reader.readAsBinaryString(fileInput.files[0]);
        }

        // CARREGAR FUNIL (Simplificado para o código caber, busca do mesmo jeito)
        async function carregarFunil() {
            const board = document.getElementById('kanbanBoard');
            board.innerHTML = '<p class="p-4">Carregando seus leads milionários...</p>';
            
            const { data, error } = await supabaseClient.from('captacoes_vitrine').select('*').order('data_mapeamento', { ascending: false });
            if (error) return;
            
            board.innerHTML = '';
            const statusLista = ['não contatado', 'contatado', 'respondeu', 'qualificado', 'visita agendada', 'autorização assinada', 'cadastrado'];
            
            statusLista.forEach(status => {
                const itens = data.filter(c => c.status_funil === status);
                let html = `<div class="bg-gray-100 rounded-lg shadow w-72 flex-shrink-0 flex flex-col"><div class="p-3 border-b bg-gray-50 font-bold capitalize">${status} (${itens.length})</div><div class="p-2 space-y-3 overflow-y-auto">`;
                
                itens.forEach(item => {
                    const precoFormatado = item.preco ? `R$ ${item.preco.toLocaleString('pt-BR')}` : 'Sob consulta';
                    const quartoTxt = item.quartos ? ` • ${item.quartos} Qts` : '';
                    
                    html += `
                        <div class="bg-white p-3 rounded shadow-sm border text-sm">
                            <p class="font-bold text-blue-900">${item.rua}</p>
                            <p class="text-xs text-gray-500 mb-1">${item.bairro} - ${item.subtipo || item.tipo_imovel}</p>
                            <p class="font-bold text-green-700">${precoFormatado}${quartoTxt}</p>
                            <p class="text-xs text-blue-500 mt-2 hover:underline"><a href="${item.link_anuncio}" target="_blank">Ver Anúncio OLX</a></p>
                        </div>
                    `;
                });
                html += `</div></div>`;
                board.innerHTML += html;
            });
        }
    </script>
</body>
</html>
